<title>دهیاری‌های بخش مرکزی سقز</title>
<style>

  body { background: #f0f8ff; color: #1a3a5c; min-height: 100vh; }
  header { background: linear-gradient(135deg, #4fc3f7, #29b6f6); color: white; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 1.5rem; }
  header .sub { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
  .select-wrapper { max-width: 500px; margin: 25px auto 10px; padding: 0 15px; }
  .select-wrapper label { display: block; margin-bottom: 8px; font-weight: bold; color: #0277bd; }
  select { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #4fc3f7; border-radius: 10px; background: white; color: #1a3a5c; cursor: pointer; outline: none; }
  #content { max-width: 800px; margin: 20px auto 40px; padding: 0 15px; }

  .card-header { background: #4fc3f7; color: white; padding: 15px 20px; font-size: 1.2rem; font-weight: bold; }
  .accordion-item { border-bottom: 1px solid #e1f5fe; }
  .accordion-item:last-child { border-bottom: none; }
  .accordion-btn { width: 100%; background: white; border: none; padding: 15px 20px; text-align: right; font-size: 1rem; font-weight: bold; color: #0277bd; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .accordion-btn:hover { background: #e1f5fe; }
  .accordion-btn .arrow { transition: transform 0.3s; font-size: 0.8rem; }
  .accordion-btn.open .arrow { transform: rotate(180deg); }
  .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: #f8fdff; }
  .accordion-content.open { max-height: 800px; }
  .accordion-content-inner { padding: 15px 20px; line-height: 2; color: #264a6e; font-size: 0.95rem; }
  .info-row { display: flex; padding: 6px 0; border-bottom: 1px dashed #cce9f7; }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { font-weight: bold; color: #0277bd; min-width: 150px; }
  .empty-msg { text-align: center; padding: 50px 20px; color: #6ba3c9; font-size: 1.05rem; }

  .modal-overlay.active { display: flex; }
  .modal { background: white; border-radius: 14px; max-width: 900px; width: 100%; max-height: 95vh; display: flex; flex-direction: column; }
  .modal-header { background: #4fc3f7; color: white; padding: 14px 20px; border-radius: 14px 14px 0 0; display: flex; justify-content: space-between; align-items: center; }

  .modal-header .close-x { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 0 5px; }
  .modal-body { padding: 18px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 12px 18px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 0.92rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #29b6f6; color: white; }
  .btn-success { background: #4caf50; color: white; }
  .btn-danger { background: #ef5350; color: white; }
  .btn-warning { background: #ff9800; color: white; }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-sm { padding: 6px 10px; font-size: 0.8rem; }

  .login-box { max-width: 340px; margin: 30px auto; }
  .login-box label { display: block; margin-bottom: 8px; font-weight: bold; color: #0277bd; }
  .login-box input { width: 100%; padding: 12px; border: 2px solid #b3e5fc; border-radius: 10px; font-size: 1rem; outline: none; }
  .login-box input:focus { border-color: #29b6f6; }
  .first-run-box { background: #fff3cd; border: 2px solid #ffc107; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  .first-run-box h3 { color: #856404; margin-bottom: 10px; font-size: 1rem; }

  .tabs { display: flex; gap: 5px; border-bottom: 2px solid #e1f5fe; margin-bottom: 15px; overflow-x: auto; }
  .tab { padding: 10px 14px; background: none; border: none; border-bottom: 3px solid transparent; color: #6ba3c9; cursor: pointer; font-size: 0.9rem; font-weight: bold; white-space: nowrap; }
  .tab.active { color: #0277bd; border-bottom-color: #29b6f6; background: #e1f5fe; }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #0277bd; font-size: 0.88rem; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px; border: 1.5px solid #b3e5fc; border-radius: 8px; font-family: inherit; font-size: 0.92rem; outline: none; }
  .form-group input:focus, .form-group textarea:focus { border-color: #29b6f6; }
  .form-group textarea { resize: vertical; min-height: 70px; }

  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e1f5fe; }
  .list-item:last-child { border-bottom: none; }
  .list-item .name { font-weight: bold; color: #0277bd; }
  .section-title { font-weight: bold; color: #0277bd; margin: 15px 0 10px; padding-bottom: 5px; border-bottom: 2px solid #e1f5fe; font-size: 1rem; }
  .hint { font-size: 0.82rem; color: #6ba3c9; margin-bottom: 10px; }
  .badge { background: #e1f5fe; color: #0277bd; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }
  .empty-box { text-align: center; padding: 20px; color: #9ec7e0; font-size: 0.9rem; }

  .field-row { display: flex; gap: 6px; margin-bottom: 8px; background: white; padding: 8px; border-radius: 8px; border: 1px solid #e1f5fe; }
  .field-row .field-key { flex: 0 0 35%; }
  .field-row .field-val { flex: 1; }
  .field-row input, .field-row textarea { padding: 8px; border: 1.5px solid #e1f5fe; border-radius: 6px; font-size: 0.88rem; outline: none; width: 100%; font-family: inherit; }
  .field-row input:focus, .field-row textarea:focus { border-color: #4fc3f7; }
  .field-row .icon-btn { flex-shrink: 0; background: #ffebee; color: #c62828; border: none; padding: 0 10px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  .field-row .icon-btn:hover { background: #ffcdd2; }
  .add-field-btn { padding: 8px 14px; background: #e8f5e9; color: #2e7d32; border: 1.5px dashed #66bb6a; border-radius: 8px; cursor: pointer; font-size: 0.88rem; margin-top: 5px; }
  .add-field-btn:hover { background: #c8e6c9; }

  .security-note { background: #e8f5e9; border-right: 4px solid #4caf50; padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; color: #2e7d32; margin: 12px 0; }

  @media (max-width: 500px) {
    header h1 { font-size: 1.1rem; }
    .info-row { flex-direction: column; }
    .info-row .label { min-width: auto; }
    .field-row { flex-wrap: wrap; }
    .field-row .field-key { flex: 1 1 100%; }
  }
</style>
</head>
 
<body>

<header>
  <h1 id="siteTitle">دهیاری‌های بخش مرکزی سقز</h1>
  <div class="sub" id="siteSub">سامانه اطلاعات دهیاری‌ها</div>
</header>

<div class="select-wrapper">

  <select id="dehyariSelect" onchange="showDehyari(this.value)">
    <option value="">-- یک دهیاری را انتخاب کنید --</option>

        </div>
        <div id="tab-sections"></div>
        <div id="tab-dehyaris" style="display:none;"></div>
        <div id="tab-settings" style="display:none;"></div>
        <div id="tab-security" style="display:none;"></div>
        <div id="tab-backup" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" onclick="saveAllAndRefresh()">💾 ذخیره و بستن</button>
        <button class="btn btn-secondary" onclick="closeAdmin()">بستن</button>
      </div>
    </div>
  </div>
</div>

const FALLBACK = {

  sections: [

    { key: "mashin", label: "🚜 ماشین آلات" }, { key: "jamiyat", label: "👥 جمعیت" },
    { key: "tarh", label: "📋 طرح‌های اجرا شده" }
  ],
  dehyaris: [{ name: "دهیاری روستای قره‌تپه", fields: { dehyar: { "نام": "علی محمدی", "تلفن": "0912..." }, roosta: { "روستا": "قره‌تپه" }, mashin: {}, jamiyat: {}, tarh: {} } }]
};
let DATA = null, editingDehyariIndex = null;
let clickCount = 0, clickTimer = null;

function loadInitialData() {
  if (typeof INITIAL_DATA !== "undefined") DATA = JSON.parse(JSON.stringify(INITIAL_DATA));
  else DATA = JSON.parse(localStorage.getItem("dehyari_panel_v4") || JSON.stringify(FALLBACK));
  if (!DATA.sections) DATA.sections = FALLBACK.sections;
  if (!DATA.dehyaris) DATA.dehyaris = [];
  DATA.dehyaris.forEach(d => { if (!d.fields) d.fields = {}; });
}
function persist() { localStorage.setItem("dehyari_panel_v4", JSON.stringify(DATA)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderSite() {
  document.getElementById("siteTitle").textContent = DATA.siteTitle || "دهیاری‌ها";
  document.getElementById("siteSub").textContent = DATA.siteSub || "";
  populateSelect();
}
function populateSelect() {
  const sel = document.getElementById("dehyariSelect"); const cur = sel.value;
  sel.innerHTML = '<option value="">-- انتخاب کنید --</option>';
  DATA.dehyaris.forEach((d, i) => { const o = document.createElement("option"); o.value = i; o.textContent = d.name; sel.appendChild(o); });
  if (cur) sel.value = cur;
}
function showDehyari(id) {
  const box = document.getElementById("content");
  if (id === "" || id === null) { box.innerHTML = '<div class="empty-msg">برای مشاهده اطلاعات، از منوی بالا یک دهیاری انتخاب کنید.</div>'; return; }
  const d = DATA.dehyaris[Number(id)]; if (!d) return;
  let html = `<div class="card"><div class="card-header">${escapeHtml(d.name)}</div>`;
  DATA.sections.forEach(sec => {
    const fields = (d.fields && d.fields[sec.key]) || {}; let inner = "";

    else Object.entries(fields).forEach(([k, v]) => { inner += `<div class="info-row"><span class="label">${escapeHtml(k)}:</span><span>${escapeHtml(v || "-")}</span></div>`; });

  });
  html += "</div>"; box.innerHTML = html;
  const first = box.querySelector(".accordion-btn"); if (first) toggleAcc(first);
}
function toggleAcc(btn) { btn.classList.toggle("open"); btn.nextElementSibling.classList.toggle("open"); }

/* ─── سیستم احراز هویت ─── */
async function hashPassword(pass) { const enc = new TextEncoder().encode(pass + "|salt"); const buf = await crypto.subtle.digest("SHA-256", enc); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join(""); }
function getStoredHash() { return localStorage.getItem("dehyari_admin_hash_v4"); }
function setStoredHash(hash) { localStorage.setItem("dehyari_admin_hash_v4", hash); }
async function verifyPassword(pass) { const stored = getStoredHash(); if (!stored) return false; return await hashPassword(pass) === stored; }

function openAdmin() {
  document.getElementById("adminModal").classList.add("active");
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("adminPanel").style.display = "none";
  document.getElementById("adminPassword").value = "";
  document.getElementById("adminPassword2").value = "";
  const hasHash = !!getStoredHash();
  document.getElementById("firstRunBox").style.display = hasHash ? "none" : "block";
  document.getElementById("confirmPassGroup").style.display = hasHash ? "none" : "block";
  document.getElementById("loginLabel").textContent = hasHash ? "رمز عبور ادمین:" : "تعیین رمز جدید:";
  document.getElementById("loginBtn").textContent = hasHash ? "ورود" : "تعیین رمز و ورود";

function closeAdmin() { document.getElementById("adminModal").classList.remove("active"); }
async function checkPassword() {
  const pass = document.getElementById("adminPassword").value; if (!pass) { alert("رمز را وارد کنید."); return; }
  if (!getStoredHash()) {
    const pass2 = document.getElementById("adminPassword2").value;
    if (pass.length < 4) { alert("رمز باید حداقل ۴ کاراکتر باشد."); return; }
    if (pass !== pass2) { alert("رمزها یکسان نیستند."); return; }
    setStoredHash(await hashPassword(pass)); alert("✅ رمز ادمین تنظیم شد."); enterAdminPanel();
  } else { if (await verifyPassword(pass)) enterAdminPanel(); else alert("❌ رمز عبور اشتباه است."); }
}
function enterAdminPanel() { document.getElementById("loginScreen").style.display = "none"; document.getElementById("adminPanel").style.display = "flex"; switchTab("sections"); }
function emergencyReset() { if (!confirm("⚠️ همه داده‌ها و رمز پاک می‌شود. ادامه؟")) return; if (!confirm("مطمئنید؟")) return; localStorage.removeItem("dehyari_admin_hash_v4"); localStorage.removeItem("dehyari_panel_v4"); alert("✅ ریست شد."); location.reload(); }

/* ─── تب‌های پنل ─── */
function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  if (event && event.target) event.target.classList.add("active");
  ["sections", "dehyaris", "settings", "security", "backup"].forEach(t => { document.getElementById("tab-" + t).style.display = (t === tab ? "block" : "none"); });
  if (tab === "sections") renderSectionsTab(); if (tab === "dehyaris") renderDehyarisTab(); if (tab === "settings") renderSettingsTab(); if (tab === "security") renderSecurityTab(); if (tab === "backup") renderBackupTab();
}
function renderSectionsTab() {
  const box = document.getElementById("tab-sections"); let html = `<div class="hint">📑 منوهای سایت را مدیریت کنید.</div>`;
  DATA.sections.forEach((sec, i) => { const fieldCount = countFieldsInSection(sec.key); html += `<div class="list-item"><div><span class="name">${escapeHtml(sec.label)}</span> <span class="badge">${fieldCount} فیلد</span></div><div><button class="btn btn-sm btn-primary" onclick="editSection(${i})">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteSection(${i})">🗑️</button></div></div>`; });
  html += `<button class="btn btn-success" style="margin-top:12px;width:100%;" onclick="addSection()">➕ افزودن بخش جدید</button>`; box.innerHTML = html;
}
function countFieldsInSection(key) { let max = 0; DATA.dehyaris.forEach(d => { const n = Object.keys((d.fields && d.fields[key]) || {}).length; if (n > max) max = n; }); return max; }
function addSection() { const key = "section_" + Date.now(); const label = prompt("نام منوی جدید:", "بخش جدید"); if (!label) return; DATA.sections.push({ key, label }); DATA.dehyaris.forEach(d => { d.fields[key] = {}; }); persist(); renderSectionsTab(); populateSelect(); }
function editSection(i) { const sec = DATA.sections[i]; const newLabel = prompt("نام جدید بخش:", sec.label); if (!newLabel) return; sec.label = newLabel; persist(); renderSectionsTab(); populateSelect(); }
function deleteSection(i) { if (!confirm("این بخش و همه فیلدهایش حذف شود؟")) return; const key = DATA.sections[i].key; DATA.sections.splice(i, 1); DATA.dehyaris.forEach(d => { delete d.fields[key]; }); persist(); renderSectionsTab(); }
function renderDehyarisTab() {
  const box = document.getElementById("tab-dehyaris");
  if (editingDehyariIndex === null) {
    let html = `<div class="hint">🏘️ دهیاری‌ها را مدیریت کنید.</div>`;
    if (DATA.dehyaris.length === 0) html += `<div class="empty-box">هیچ دهیاری ثبت نشده.</div>`;
    else DATA.dehyaris.forEach((d, i) => { html += `<div class="list-item"><div class="name">${escapeHtml(d.name)}</div><div><button class="btn btn-sm btn-primary" onclick="editDehyari(${i})">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteDehyari(${i})">🗑️</button></div></div>`; });
    html += `<button class="btn btn-success" style="margin-top:12px;width:100%;" onclick="addDehyari()">➕ افزودن دهیاری جدید</button>`; box.innerHTML = html; return;
  }
  const d = DATA.dehyaris[editingDehyariIndex];
  let html = `<button class="btn btn-secondary btn-sm" onclick="editingDehyariIndex=null;renderDehyarisTab()">← بازگشت</button><div class="form-group" style="margin-top:12px;"><label>نام دهیاری:</label><input type="text" value="${escapeHtml(d.name)}" onchange="updateDehyariName(this.value)"></div>`;
  DATA.sections.forEach(sec => { if (!d.fields[sec.key]) d.fields[sec.key] = {}; html += `<div class="section-title">${escapeHtml(sec.label)}</div><div id="fields-${sec.key}"></div><button class="add-field-btn" onclick="addFieldToSection('${sec.key}')">➕ افزودن فیلد</button>`; });
  box.innerHTML = html; DATA.sections.forEach(sec => renderFieldsForSection(sec.key));

  if(id===""||id===null){box.innerHTML='<div class="empty-msg">برای مشاهده اطلاعات، از منوی بالا یک دهیاری انتخاب کنید.</div>';return}
  var x=D.d[Number(id)];if(!x)return;
  var html='<div class="card"><div class="card-header">'+H(x.n)+'</div>';
  D.s.forEach(function(sec){
    var f=(x.f&&x.f[sec.k])||{},inner="";
    if(Object.keys(f).length===0){inner="<p>اطلاعاتی ثبت نشده است.</p>"}
    else{
      Object.entries(f).forEach(function(e){
        var k=e[0],v=e[1];
        if(v&&typeof v==='object'&&v.type==='image'){
          inner+='<div class="info-row" style="flex-direction:column; align-items:flex-start;"><span class="label">'+H(k)+':</span>';
          if(v.img)inner+='<img src="'+H(v.img)+'" style="max-width:100%; border-radius:8px; margin:8px 0; max-height:300px; object-fit:contain;">';
          if(v.text)inner+='<span style="color:#264a6e; margin-top:5px;">'+H(v.text)+'</span>';
          inner+='</div>';
        }else{
          inner+='<div class="info-row"><span class="label">'+H(k)+':</span><span>'+H(v||"-")+'</span></div>';
        }
      });
    }
    html+='<div class="accordion-item"><button class="accordion-btn" onclick="toggleAcc(this)"><span>'+H(sec.l)+'</span><span class="arrow">▼</span></button><div class="accordion-content"><div class="accordion-content-inner">'+inner+'</div></div></div>';
  });
  box.innerHTML=html+'</div>';
  var first=box.querySelector(".accordion-btn");if(first)toggleAcc(first);
}
window.toggleAcc=function(b){b.classList.toggle("open");b.nextElementSibling.classList.toggle("open")};

async function hash(pass){var enc=new TextEncoder().encode(pass+"|salt");var buf=await crypto.subtle.digest("SHA-256",enc);return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
function getH(){return localStorage.getItem("dehyari_admin_hash_v6")}
function setH(h){localStorage.setItem("dehyari_admin_hash_v6",h)}
async function verify(pass){var st=getH();if(!st)return false;return await hash(pass)===st}

function O(){
  document.getElementById("adminModal").classList.add("active");
  document.getElementById("loginScreen").style.display="block";
  document.getElementById("adminPanel").style.display="none";
  document.getElementById("adminPassword").value="";
  document.getElementById("adminPassword2").value="";
  var has=!!getH();
  document.getElementById("firstRunBox").style.display=has?"none":"block";
  document.getElementById("confirmPassGroup").style.display=has?"none":"block";
  document.getElementById("loginLabel").textContent=has?"رمز عبور ادمین:":"تعیین رمز جدید:";
  document.getElementById("loginBtn").textContent=has?"ورود":"تعیین رمز و ورود";
}
window.closeAdmin=function(){document.getElementById("adminModal").classList.remove("active")};

window.checkPassword=async function(){
  var pass=document.getElementById("adminPassword").value;if(!pass){alert("رمز را وارد کنید.");return}
  if(!getH()){
    var pass2=document.getElementById("adminPassword2").value;
    if(pass.length<4){alert("رمز باید حداقل ۴ کاراکتر باشد.");return}
    if(pass!==pass2){alert("رمزها یکسان نیستند.");return}
    setH(await hash(pass));alert("✅ رمز ادمین تنظیم شد.");enterPanel();
  }else{if(await verify(pass))enterPanel();else alert("❌ رمز عبور اشتباه است.")}
};

function enterPanel(){document.getElementById("loginScreen").style.display="none";document.getElementById("adminPanel").style.display="flex";switchTab("sections")}

window.emergencyReset=function(){
  if(!confirm("⚠️ همه داده‌ها و رمز پاک می‌شود. ادامه؟"))return;
  if(!confirm("مطمئنید؟"))return;
  localStorage.removeItem("dehyari_admin_hash_v6");
  localStorage.removeItem("dehyari_panel_v6");
  alert("✅ ریست شد.");location.reload();
};

window.switchTab=function(tab){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
  if(event&&event.target)event.target.classList.add("active");
  ["sections","dehyaris","settings","security","backup"].forEach(function(t){document.getElementById("tab-"+t).style.display=(t===tab?"block":"none")});
  if(tab==="sections")renderSec();if(tab==="dehyaris")renderDeh();if(tab==="settings")renderSet();if(tab==="security")renderSecu();if(tab==="backup")renderBak();
};

function renderSec(){
  var box=document.getElementById("tab-sections"),html='<div class="hint">📑 منوهای سایت را مدیریت کنید.</div>';
  D.s.forEach(function(sec,i){
    var fc=countF(sec.k);
    html+='<div class="list-item"><div><span class="name">'+H(sec.l)+'</span> <span class="badge">'+fc+' فیلد</span></div><div><button class="btn btn-sm btn-primary" onclick="editSection('+i+')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteSection('+i+')">🗑️</button></div></div>';
  });
  html+='<button class="btn btn-success" style="margin-top:12px;width:100%;" onclick="addSection()">➕ افزودن بخش جدید</button>';
  box.innerHTML=html;
}

function countF(key){var max=0;D.d.forEach(function(x){var n=Object.keys((x.f&&x.f[key])||{}).length;if(n>max)max=n});return max}

window.addSection=function(){var key="section_"+Date.now();var label=prompt("نام منوی جدید:","بخش جدید");if(!label)return;D.s.push({k:key,l:label});D.d.forEach(function(x){x.f[key]={}});P();renderSec();R()};
window.editSection=function(i){var sec=D.s[i];var nl=prompt("نام جدید بخش:",sec.l);if(!nl)return;sec.l=nl;P();renderSec();R()};
window.deleteSection=function(i){if(!confirm("این بخش و همه فیلدهایش حذف شود؟"))return;var key=D.s[i].k;D.s.splice(i,1);D.d.forEach(function(x){delete x.f[key]});P();renderSec()};

function renderDeh(){
  var box=document.getElementById("tab-dehyaris");
  if(E===null){
    var html='<div class="hint">🏘️ دهیاری‌ها را مدیریت کنید.</div>';
    if(D.d.length===0){html+='<div class="empty-box">هیچ دهیاری ثبت نشده.</div>'}else{D.d.forEach(function(x,i){html+='<div class="list-item"><div class="name">'+H(x.n)+'</div><div><button class="btn btn-sm btn-primary" onclick="editDehyari('+i+')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteDehyari('+i+')">🗑️</button></div></div>'})}
    html+='<button class="btn btn-success" style="margin-top:12px;width:100%;" onclick="addDehyari()">➕ افزودن دهیاری جدید</button>';
    box.innerHTML=html;return;
  }
  var x=D.d[E];
  var html='<button class="btn btn-secondary btn-sm" onclick="E=null;renderDeh()">← بازگشت</button><div class="form-group" style="margin-top:12px;"><label>نام دهیاری:</label><input type="text" value="'+H(x.n)+'" onchange="updateDehyariName(this.value)"></div>';
  D.s.forEach(function(sec){
    if(!x.f[sec.k])x.f[sec.k]={};
    html+='<div class="section-title">'+H(sec.l)+'</div><div id="fields-'+sec.k+'"></div><button class="add-field-btn" onclick="addFieldToSection(\''+sec.k+'\')">➕ افزودن فیلد</button>';
  });
  box.innerHTML=html;D.s.forEach(function(sec){renderFields(sec.k)});
}

function renderFields(secKey){
  var x=D.d[E],container=document.getElementById("fields-"+secKey);if(!container)return;
  var fields=x.f[secKey]||{},html="",entries=Object.entries(fields);
  if(entries.length===0){html='<div class="empty-box" style="padding:10px;">فیلدی ندارد.</div>'}else{
    entries.forEach(function(e,idx){
      var k=e[0],v=e[1];
      var isImg = (v && typeof v==='object' && v.type==='image');
      
      html+='<div class="field-row" style="flex-direction:column; align-items:stretch; background:#f8fdff;"><div style="display:flex; gap:6px; margin-bottom:8px;"><input class="field-key" style="flex:1;" type="text" value="'+H(k)+'" onchange="renameField(\''+secKey+'\','+idx+',this.value)"><button class="icon-btn" onclick="deleteField(\''+secKey+'\','+idx+')">✕</button></div>';
      
      if(isImg){
        html+='<div style="background:white; padding:10px; border-radius:6px; border:1px solid #b3e5fc;">';
        if(v.img) html+='<img src="'+H(v.img)+'" style="max-width:100%; max-height:150px; border-radius:6px; margin-bottom:8px; display:block;">';
        html+='<label style="font-size:0.8rem; color:#0277bd;">آپلود عکس:</label><input type="file" accept="image/*" onchange="uploadImage(event, \''+secKey+'\', '+idx+')" style="font-size:0.8rem; margin-bottom:8px; display:block;">';
        html+='<label style="font-size:0.8rem; color:#0277bd;">توضیحات زیر عکس:</label><textarea onchange="updateImgText(\''+secKey+'\','+idx+',this.value)" style="min-height:60px;">'+H(v.text||"")+'</textarea></div>';
      }else{
        html+='<div class="field-val">';
        if(String(v).length>60){html+='<textarea onchange="updateFieldValue(\''+secKey+'\','+idx+',this.value)">'+H(v)+'</textarea>'}else{html+='<input type="text" value="'+H(v)+'" onchange="updateFieldValue(\''+secKey+'\','+idx+',this.value)">'}
        html+='</div>';
      }
      html+='</div>';
    });
  }
  container.innerHTML=html;
}

window.addDehyari=function(){var name=prompt("نام دهیاری جدید:","دهیاری ...");if(!name)return;var newD={n:name,f:{}};D.s.forEach(function(sec){newD.f[sec.k]={}});D.d.push(newD);P();E=D.d.length-1;renderDeh();R()};
window.editDehyari=function(i){E=i;renderDeh()};
window.deleteDehyari=function(i){if(!confirm('«'+D.d[i].n+'» حذف شود؟'))return;D.d.splice(i,1);P();renderDeh();R();S(document.getElementById("dehyariSelect").value)};
window.updateDehyariName=function(v){D.d[E].n=v;P();R()};

window.addFieldToSection=function(secKey){
  var type = confirm("آیا این فیلد باید «عکس + توضیحات» باشد؟\n\n(برای فیلد متنی معمولی، دکمه Cancel را بزنید)");
  var key=prompt("نام فیلد جدید:","فیلد جدید");if(!key)return;
  var x=D.d[E];if(!x.f[secKey])x.f[secKey]={};
  if(x.f[secKey][key]!==undefined){alert("تکراری است.");return}
  
  if(type){
    x.f[secKey][key]={type:"image", img:"", text:""};
  }else{
    x.f[secKey][key]="";
  }
  P();renderFields(secKey);
};

window.renameField=function(secKey,idx,newKey){
  var x=D.d[E],entries=Object.entries(x.f[secKey]);if(!entries[idx])return;
  var oldKey=entries[idx][0];if(oldKey===newKey)return;
  var nf={};Object.entries(x.f[secKey]).forEach(function(e){if(e[0]===oldKey)nf[newKey]=e[1];else nf[e[0]]=e[1]});
  x.f[secKey]=nf;P();renderFields(secKey);
};

window.updateFieldValue=function(secKey,idx,val){
  var x=D.d[E],keys=Object.keys(x.f[secKey]);
  if(keys[idx]){x.f[secKey][keys[idx]]=val;P()}
};

window.updateImgText=function(secKey,idx,val){
  var x=D.d[E],keys=Object.keys(x.f[secKey]);
  if(keys[idx]){x.f[secKey][keys[idx]].text=val;P()}
};

window.uploadImage=function(event, secKey, idx){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement("canvas");
      var MAX_WIDTH=600; var MAX_HEIGHT=600;
      var width=img.width; var height=img.height;
      if(width>height){ if(width>MAX_WIDTH){ height*=MAX_WIDTH/width; width=MAX_WIDTH; } }
      else { if(height>MAX_HEIGHT){ width*=MAX_HEIGHT/height; height=MAX_HEIGHT; } }
      canvas.width=width; canvas.height=height;
      var ctx=canvas.getContext("2d"); ctx.drawImage(img,0,0,width,height);
      var dataUrl=canvas.toDataURL("image/jpeg", 0.7);
      var x=D.d[E],keys=Object.keys(x.f[secKey]);
      if(keys[idx]){ x.f[secKey][keys[idx]].img=dataUrl; P(); renderFields(secKey); }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
};

window.deleteField=function(secKey,idx){
  var x=D.d[E],keys=Object.keys(x.f[secKey]);if(!keys[idx])return;
  if(!confirm('فیلد «'+keys[idx]+'» حذف شود؟'))return;
  delete x.f[secKey][keys[idx]];P();renderFields(secKey);
};

function renderSet(){document.getElementById("tab-settings").innerHTML='<div class="hint">⚙️ تنظیمات کلی.</div><div class="form-group"><label>عنوان اصلی:</label><input type="text" id="setting-title" value="'+H(D.sT||"")+'"></div><div class="form-group"><label>زیرعنوان:</label><input type="text" id="setting-sub" value="'+H(D.sS||"")+'"></div><button class="btn btn-success" style="width:100%;" onclick="saveSettings()">💾 ذخیره</button>'}
window.saveSettings=function(){D.sT=document.getElementById("setting-title").value.trim()||"دهیاری‌ها";D.sS=document.getElementById("setting-sub").value.trim();P();R();alert("✅ ذخیره شد.")};

function renderSecu(){document.getElementById("tab-security").innerHTML='<div class="hint">🔐 مدیریت رمز ادمین.</div><div class="form-group"><label>رمز فعلی:</label><input type="password" id="sec-old-pass"></div><div class="form-group"><label>رمز جدید:</label><input type="password" id="sec-new-pass"></div><div class="form-group"><label>تکرار رمز جدید:</label><input type="password" id="sec-new-pass2"></div><button class="btn btn-warning" style="width:100%;" onclick="changePassword()">🔄 تغییر رمز</button><div class="section-title" style="color:#c62828; margin-top:25px;">⚠️ منطقه خطر</div><button class="btn btn-danger" style="width:100%;" onclick="emergencyReset()">🆘 ریست کامل</button>'}

window.changePassword=async function(){
  var old=document.getElementById("sec-old-pass").value,nw=document.getElementById("sec-new-pass").value,nw2=document.getElementById("sec-new-pass2").value;
  if(!await verify(old)){alert("❌ رمز فعلی اشتباه.");return}
  if(nw.length<4){alert("حداقل ۴ کاراکتر.");return}
  if(nw!==nw2){alert("یکسان نیستند.");return}
  setH(await hash(nw));alert("✅ تغییر کرد.");
};

function renderBak(){document.getElementById("tab-backup").innerHTML='<div class="hint">💾 پشتیبان.</div><div class="section-title">📤 خروجی</div><button class="btn btn-success" style="width:100%; margin-bottom:10px;" onclick="downloadDataJs()">⬇️ دانلود data.js</button><button class="btn btn-primary" style="width:100%; margin-bottom:20px;" onclick="downloadJson()">⬇️ دانلود JSON</button><div class="section-title">📥 ورودی</div><input type="file" id="uploadFile" accept=".js,.json" style="display:none" onchange="handleFileUpload(event)"><button class="btn btn-warning" style="width:100%;" onclick="document.getElementById(\'uploadFile\').click()">📂 بارگذاری پشتیبان</button>'}

window.downloadDataJs=function(){var c="const INITIAL_DATA = "+JSON.stringify(D,null,2)+";\n";var b=new Blob([c],{type:"text/javascript;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="data.js";a.click()};
window.downloadJson=function(){var b=new Blob([JSON.stringify(D,null,2)],{type:"application/json;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dehyari-backup.json";a.click()};

window.handleFileUpload=function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var p=JSON.parse(ev.target.result);
      if(!p.d&&!p.dehyaris)throw new Error("نامعتبر");
      if(!confirm("جایگزین شود؟"))return;
      D=p;if(!D.s&&D.sections)D.s=D.sections;if(!D.d&&D.dehyaris)D.d=D.dehyaris;
      if(!D.sT&&D.siteTitle)D.sT=D.siteTitle;if(!D.sS&&D.siteSub)D.sS=D.siteSub;
      P();R();switchTab("sections");alert("✅ شد.");
    }catch(err){alert("❌ خطا: "+err.message)}
  };
  r.readAsText(file);e.target.value="";
};

window.saveAllAndRefresh=function(){P();R();var cur=document.getElementById("dehyariSelect").value;if(cur)S(cur);closeAdmin();alert("✅ ذخیره شد.")};

I();R();S("");
